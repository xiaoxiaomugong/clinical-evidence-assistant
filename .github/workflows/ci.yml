name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install local website dependencies
        run: |
          python -m pip install -e '.[web,dev,pdf,ui]'
          npm --prefix frontend ci --no-audit --no-fund
      - name: Offline backend regression
        run: python scripts/test_offline.py -q
      - name: Real API smoke
        run: python scripts/run_web.py --check
      - name: Frontend tests and build
        run: |
          npm --prefix frontend test
          npm --prefix frontend run typecheck
          npm --prefix frontend run build

  test:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_ASSISTANT_ENV_FILE: /dev/null
      ENABLE_LIVE_APIS: "false"
      ENABLE_SUPABASE: "false"
      LLM_API_KEY: ""
      PUBMED_API_KEY: ""
      NCBI_EMAIL: ""
      SUPABASE_URL: ""
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      MODEL_LOCAL_FILES_ONLY: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      RETRIEVAL_BACKEND: legacy
      RERANK_BACKEND: deterministic
      CANDIDATE_POOL_POLICY: source_preserving
      TOP8_SELECTION_POLICY: legacy
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install MCP tool extra
        if: matrix.python-version == '3.11'
        run: python -m pip install -e '.[mcp]'
      - name: Run tests
        run: pytest -q
        env:
          EVIDENCE_ASSISTANT_ENV_FILE: /tmp/clinical-evidence-ci-absent.env
          ENABLE_LIVE_APIS: "false"
          ENABLE_SUPABASE: "false"
          LLM_API_KEY: ""
      - name: Require MCP runtime and verify real stdio transport
        if: matrix.python-version == '3.11'
        env:
          CLINICAL_REQUIRE_MCP: "1"
          EVIDENCE_ASSISTANT_ENV_FILE: /tmp/clinical-evidence-ci-absent.env
          ENABLE_LIVE_APIS: "false"
          ENABLE_SUPABASE: "false"
          LLM_API_KEY: ""
        run: |
          python -c "import sys, mcp; assert sys.version_info[:2] == (3, 11)"
          python -m pytest -q tests/test_mcp_server.py tests/test_mcp_stdio.py
      - name: Run offline smoke test
        env:
          ENABLE_LIVE_APIS: "false"
          LLM_API_KEY: ""
        run: python scripts/smoke_test.py
      - name: Check installed UI entry point
        if: matrix.python-version == '3.11'
        env:
          ENABLE_LIVE_APIS: "false"
          LLM_API_KEY: ""
        run: clinical-evidence-ui --check
      - name: Freeze current C0 and check two isolated repeats
        run: |
          python scripts/freeze_current_baseline.py --output data/eval_runs/ci-current-c0
          python -m eval.run_p0 --baseline-source current --baseline data/eval_runs/ci-current-c0 --output data/eval_runs/ci-regression --profiles C0 --arms G1
      - name: Compare C0 against independent Git reference
        if: github.event_name == 'pull_request'
        env:
          CEA_REFERENCE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test -n "$CEA_REFERENCE_SHA"
          python scripts/freeze_reference_from_git.py --ref "$CEA_REFERENCE_SHA" --output data/eval_runs/ci-fixed-reference
          python -m eval.run_p0 --baseline-source current --baseline data/eval_runs/ci-fixed-reference --output data/eval_runs/ci-cross-version --profiles C0 --arms G1
      - name: Independent synthetic C0 annotation loop
        run: python -m eval.independent synthetic-e2e --output data/eval_runs/ci-independent-synthetic
