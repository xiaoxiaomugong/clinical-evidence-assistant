worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker's resolver refreshes the API address when its container is replaced.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Only successful requests for Vite's versioned assets are cacheable.
    map "$uri:$status" $response_cache_control {
        default "no-store";
        "~^/assets/.+:(200|206|304)$" "public, max-age=31536000, immutable";
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 64k;

        add_header Cache-Control $response_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_cache off;

        # Match the entire API/health namespace, including unknown endpoints.
        # With no URI suffix, proxy_pass preserves the full request URI.
        location ~ ^/(api|health)(/|$) {
            set $api_origin api:8766;
            proxy_pass http://$api_origin;
        }

        location ^~ /assets/ {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            try_files $uri =404;
        }

        location / {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            try_files $uri $uri/ /index.html;
        }
    }
}
