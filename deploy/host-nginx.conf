# Included from the existing host nginx.conf http block via sites-enabled/*.
# Enable this file only once; its map and zone names belong to this site.
# Official reference: https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_pass

# Use the normalized path for matching while preserving the original request URI
# when proxying. An empty key leaves other methods and paths outside these limits.
map "$request_method:$uri" $clinical_evidence_query_client_ip {
    default "";
    "POST:/api/v1/queries" $binary_remote_addr;
}

limit_req_zone $clinical_evidence_query_client_ip
    zone=clinical_evidence_query_rate:1m rate=12r/m;
limit_conn_zone $clinical_evidence_query_client_ip
    zone=clinical_evidence_query_concurrency:1m;

server {
    listen 80;
    listen [::]:80;
    server_name clinicalevidenceassistant.xin;

    access_log off;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # The host is the public entry point. Replace incoming forwarded IP headers
    # with the connection's client IP before forwarding to the loopback service.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Certbot --webroot -w /var/www/clinical-evidence-acme writes tokens below
    # this root's .well-known/acme-challenge directory, separate from the app.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/clinical-evidence-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        # Average 12 query submissions per minute per client IP, allowing a burst
        # of 3 and at most 2 simultaneous submissions. Rejections return 429.
        limit_req zone=clinical_evidence_query_rate burst=3 nodelay;
        limit_req_status 429;
        limit_conn clinical_evidence_query_concurrency 2;
        limit_conn_status 429;

        # No URI suffix or rewrite: preserve paths, escaping and query strings.
        proxy_pass http://127.0.0.1:8088;
    }
}
