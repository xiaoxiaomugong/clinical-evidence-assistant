# Replace the HTTP-only site file with this file after obtaining its certificate.
# Included from the existing host nginx.conf http block via sites-enabled/*.
# Enable only one variant of the site so these map and zone names are defined once.

map "$request_method:$uri" $clinical_evidence_query_client_ip {
    default "";
    "POST:/api/v1/queries" $binary_remote_addr;
}

limit_req_zone $clinical_evidence_query_client_ip
    zone=clinical_evidence_query_rate:1m rate=12r/m;
limit_conn_zone $clinical_evidence_query_client_ip
    zone=clinical_evidence_query_concurrency:1m;

server {
    listen 80;
    listen [::]:80;
    server_name clinicalevidenceassistant.xin;

    access_log off;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;

    # Keep this path reachable over HTTP for certificate renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/clinical-evidence-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://clinicalevidenceassistant.xin$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name clinicalevidenceassistant.xin;

    ssl_certificate /etc/letsencrypt/live/clinicalevidenceassistant.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinicalevidenceassistant.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # A short initial HSTS lifetime applies to this domain only.
    add_header Strict-Transport-Security "max-age=86400" always;

    access_log off;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # Replace incoming forwarded IP headers with the public connection's client IP.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        limit_req zone=clinical_evidence_query_rate burst=3 nodelay;
        limit_req_status 429;
        limit_conn clinical_evidence_query_concurrency 2;
        limit_conn_status 429;

        # Preserve the original path, escaping and query string without rewriting.
        proxy_pass http://127.0.0.1:8088;
        # The API uses internal HTTP; keep its absolute redirects on public HTTPS.
        proxy_redirect http://clinicalevidenceassistant.xin/ https://clinicalevidenceassistant.xin/;
    }
}
