[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-evidence-assistant"
version = "0.1.0"
description = "Offline-first, citation-grounded clinical evidence assistant MVP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31,<3",
  "urllib3>=1.26,<2; python_version < '3.10'",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32,<2"]
pdf = ["pymupdf>=1.24,<2"]
dev = ["pytest>=8,<9"]
mcp = ["mcp>=2,<3"]
retrieval = [
  "numpy>=1.24",
  "sentence-transformers>=3.0",
]

[project.scripts]
clinical-evidence-mcp = "evidence_assistant.mcp_server:main"
clinical-evidence-ui = "evidence_assistant.desktop:main"

[project.urls]
Homepage = "https://github.com/xiaoxiaomugong/clinical-evidence-assistant"
Repository = "https://github.com/xiaoxiaomugong/clinical-evidence-assistant"
Issues = "https://github.com/xiaoxiaomugong/clinical-evidence-assistant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/clinical-evidence-assistant" = [
  "app.py",
]
"share/clinical-evidence-assistant/data" = [
  "data/corpus_version.json",
]
"share/clinical-evidence-assistant/data/knowledge_pages" = [
  "data/knowledge_pages/*.json",
]
"share/clinical-evidence-assistant/data/raw" = [
  "data/raw/local_corpus.json",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
