[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-evidence-assistant"
version = "0.1.0"
description = "Offline-first, citation-grounded clinical evidence assistant MVP"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31,<3",
  "urllib3>=1.26,<2; python_version < '3.10'",
  "python-dotenv>=1.0,<2",
  "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32,<2"]
dev = ["pytest>=8,<9"]
retrieval = [
  "numpy>=1.24",
  "sentence-transformers>=3.0",
]

[project.urls]
Homepage = "https://github.com/xiaoxiaomugong/clinical-evidence-assistant"
Repository = "https://github.com/xiaoxiaomugong/clinical-evidence-assistant"
Issues = "https://github.com/xiaoxiaomugong/clinical-evidence-assistant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
