name: clinical-evidence

services:
  api:
    image: clinical-evidence-api:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    networks: [backend]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: clinical-evidence-web:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:8088:8080
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    networks: [frontend, backend]
    healthcheck:
      test: [CMD, wget, -q, -T, "5", -O, /dev/null, "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  frontend: {}
  backend:
    internal: true
